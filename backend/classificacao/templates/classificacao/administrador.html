{% load static %}
<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Administrador</title>
  <link rel="stylesheet" href="{% static 'css/style.css' %}">
  <link rel="stylesheet" href="{% static 'css/administrador.css' %}">
</head>

<body class="sistema" data-pagina="administrador" data-admin="1">

  <nav class="menu" id="menu"></nav>

  <div class="conteudo">
    <header class="cabecalho" id="topo"></header>

    <main>
      <div class="titulos">
        <h1>Perfil do Usuário</h1>
        <p class="sub">Informações do administrador autenticado</p>
      </div>

      <section class="cartao perfil">
        <div class="topo">
          <div class="avatar" id="perfilAvatar"></div>
          <div>
            <div class="nome" id="perfilNome"></div>
            <div class="cargo" id="perfilCargo"></div>
          </div>
        </div>
        <div class="perfil-dados">
          <div>
            <div class="rot">Usuário</div>
            <div class="val" id="perfilUsuario"></div>
          </div>
          <div>
            <div class="rot">Instituição</div>
            <div class="val" id="perfilInst"></div>
          </div>
          <div>
            <div class="rot">Departamento</div>
            <div class="val" id="perfilDepto"></div>
          </div>
        </div>
        <button type="button" class="btn-sair" id="btnSair">SAIR</button>
      </section>

      <p class="atalhos">
        <a class="btn peq" href="/parametros/">Parâmetros de classificação</a>
        <a class="btn peq contorno" href="/configuracoes/">Configurações gerais</a>
        <a class="btn peq contorno" href="/historico/">Histórico de atendimentos</a>
      </p>

      <div class="titulos titulo-geral">
        <h1>Usuários</h1>
        <p class="sub">Cadastre e gerencie quem acessa o sistema</p>
      </div>

      <section class="cartao usuarios">
        <form id="fUser" class="usuario-form" novalidate>
          <input type="hidden" name="id">
          <label class="campo">Nome<input type="text" name="nome"></label>
          <label class="campo">Usuário<input type="text" name="usuario"></label>
          <label class="campo">Senha<input type="password" name="senha" autocomplete="new-password"></label>
          <label class="campo">Perfil
            <select name="perfil">
              <option value="enfermeiro">Enfermeiro</option>
              <option value="admin">Administrador</option>
            </select>
          </label>
          <button class="btn peq">Salvar usuário</button>
        </form>

        <p class="aviso" id="msgUser" hidden></p>

        <div class="scroll">
          <table>
            <thead>
              <tr>
                <th>Nome</th>
                <th>Usuário</th>
                <th>Perfil</th>
                <th>Ações</th>
              </tr>
            </thead>
            <tbody id="usuarios"></tbody>
          </table>
        </div>
      </section>
    </main>
  </div>

  <script src="{% static 'js/api.js' %}"></script>
  <script src="{% static 'js/app.js' %}"></script>
  <script src="{% static 'js/administrador.js' %}"></script>
</body>

</html>
